openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Mother Bot API - SKZ Financial Hub
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: wallets
    description: Wallet operations
  - name: transactions
    description: Transaction history
  - name: bots
    description: Child bot management
  - name: commissions
    description: Commission tracking
  - name: withdrawals
    description: Withdrawal requests
  - name: settings
    description: Platform settings and SKZ rates
  - name: internal
    description: Internal API for child bots
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /users/{telegramId}:
    get:
      operationId: getUserByTelegramId
      tags: [users]
      summary: Get user by Telegram ID
      parameters:
        - in: path
          name: telegramId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithWallet"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/{userId}:
    get:
      operationId: getWallet
      tags: [wallets]
      summary: Get wallet for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Wallet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: sourceBot
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"

  /bots:
    get:
      operationId: listBots
      tags: [bots]
      summary: List all registered child bots
      responses:
        "200":
          description: List of bots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotListResponse"
    post:
      operationId: createBot
      tags: [bots]
      summary: Register a new child bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotBody"
      responses:
        "201":
          description: Bot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"

  /bots/{slug}:
    get:
      operationId: getBot
      tags: [bots]
      summary: Get bot details
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBot
      tags: [bots]
      summary: Update bot settings (commission rate, name, description, active status)
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotUpdate"
      responses:
        "200":
          description: Bot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /commissions:
    get:
      operationId: listCommissions
      tags: [commissions]
      summary: List commissions
      parameters:
        - in: query
          name: botSlug
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of commissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionListResponse"

  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List withdrawals
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of withdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListResponse"
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Create a withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWithdrawalBody"
      responses:
        "201":
          description: Withdrawal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          description: Invalid request or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /withdrawals/{id}/approve:
    post:
      operationId: approveWithdrawal
      tags: [withdrawals]
      summary: Approve a withdrawal request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveWithdrawalBody"
      responses:
        "200":
          description: Withdrawal approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /withdrawals/{id}/reject:
    post:
      operationId: rejectWithdrawal
      tags: [withdrawals]
      summary: Reject a withdrawal request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectWithdrawalBody"
      responses:
        "200":
          description: Withdrawal rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings:
    get:
      operationId: getAllSettings
      tags: [settings]
      summary: Get all platform settings (SKZ rates, financial limits, content texts)
      responses:
        "200":
          description: All platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Batch update platform settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsInput"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"

  /settings/skz-rates:
    get:
      operationId: getSkzRates
      tags: [settings]
      summary: Get current SKZ exchange rates
      responses:
        "200":
          description: Current SKZ rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkzRates"
    put:
      operationId: updateSkzRates
      tags: [settings]
      summary: Update SKZ exchange rates (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkzRatesInput"
      responses:
        "200":
          description: Rates updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkzRates"

  /internal/users/upsert:
    post:
      operationId: internalUpsertUser
      tags: [internal]
      summary: Create or update a user (called by child bots)
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserBody"
      responses:
        "200":
          description: User upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithWallet"

  /internal/deposit:
    post:
      operationId: internalDeposit
      tags: [internal]
      summary: Deposit real currency, convert to SKZ (called by mother bot)
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositBody"
      responses:
        "200":
          description: Deposit successful, SKZ credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/credit:
    post:
      operationId: internalCredit
      tags: [internal]
      summary: Credit SKZ to a user wallet (called by child bots after earning)
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditBody"
      responses:
        "200":
          description: Credit applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/debit:
    post:
      operationId: internalDebit
      tags: [internal]
      summary: Debit SKZ from a user wallet (called by child bots for purchases)
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitBody"
      responses:
        "200":
          description: Debit applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebitResponse"
        "400":
          description: Insufficient balance or error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/balance/{telegramId}:
    get:
      operationId: internalGetBalance
      tags: [internal]
      summary: Get wallet balances by Telegram ID (called by child bots)
      security:
        - BotApiKey: []
      parameters:
        - in: path
          name: telegramId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalBalanceResponse"
        "404":
          description: User or wallet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/ledger/{telegramId}:
    get:
      operationId: internalGetLedger
      tags: [internal]
      summary: Get transaction history by Telegram ID (called by child bots)
      security:
        - BotApiKey: []
      parameters:
        - in: path
          name: telegramId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalLedgerResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/game/charge-entry:
    post:
      operationId: internalGameChargeEntry
      tags: [internal]
      summary: Charge game entry fee (debit with game metadata)
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameChargeEntryBody"
      responses:
        "200":
          description: Entry fee charged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebitResponse"
        "400":
          description: Insufficient balance or error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/game/validate-result:
    post:
      operationId: internalGameValidateResult
      tags: [internal]
      summary: Validate game completion and issue a signed resultToken (10-min TTL)
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameValidateResultBody"
      responses:
        "200":
          description: Result token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameValidateResultResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session already credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/game/credit-reward:
    post:
      operationId: internalGameCreditReward
      tags: [internal]
      summary: Credit game reward (credit with commission + referral + game metadata)
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameCreditRewardBody"
      responses:
        "200":
          description: Reward credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameCreditRewardResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/stars-invoice:
    post:
      operationId: internalCreateStarsInvoice
      tags: [internal]
      summary: Create Telegram Stars deposit invoice
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarsInvoiceBody"
      responses:
        "200":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarsInvoiceResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/ton-deposit-intent:
    post:
      operationId: internalCreateTonDepositIntent
      tags: [internal]
      summary: Create TON deposit intent with unique memo
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TonDepositIntentBody"
      responses:
        "200":
          description: Deposit intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TonDepositIntentResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /internal/withdraw:
    post:
      operationId: internalWithdraw
      tags: [internal]
      summary: Create a pending SKZ withdrawal request (no pre-deduction; balance deducted on admin approve)
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalWithdrawBody"
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalWithdrawResponse"
        "400":
          description: Insufficient balance or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [internal]
      summary: Platform-wide financial stats
      responses:
        "200":
          description: Stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

components:
  securitySchemes:
    BotApiKey:
      type: apiKey
      in: header
      name: X-Bot-Api-Key

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SkzRates:
      type: object
      properties:
        skzPerUsdt:
          type: string
          description: How many SKZ per 1 USDT
        skzPerStar:
          type: string
          description: How many SKZ per 1 Telegram Star
        skzPerTon:
          type: string
          description: How many SKZ per 1 TON
        updatedAt:
          type: string
          format: date-time
      required:
        - skzPerUsdt
        - skzPerStar
        - skzPerTon
        - updatedAt

    SkzRatesInput:
      type: object
      properties:
        skzPerUsdt:
          type: string
        skzPerStar:
          type: string
        skzPerTon:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: string
        lastName:
          type: ["string", "null"]
        languageCode:
          type: ["string", "null"]
        isPremium:
          type: boolean
        isBlocked:
          type: boolean
        referrerId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - telegramId
        - firstName
        - isPremium
        - isBlocked
        - createdAt

    Wallet:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        balanceSkz:
          type: string
          description: Primary SKZ balance (main platform currency)
        balanceStars:
          type: string
        balanceUsdt:
          type: string
        balanceTon:
          type: string
        totalEarnedSkz:
          type: string
        totalWithdrawnSkz:
          type: string
        totalEarned:
          type: string
        totalWithdrawn:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - balanceSkz
        - balanceStars
        - balanceUsdt
        - balanceTon
        - totalEarnedSkz
        - totalWithdrawnSkz
        - totalEarned
        - totalWithdrawn
        - updatedAt

    UserWithWallet:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        wallet:
          $ref: "#/components/schemas/Wallet"
      required:
        - user
        - wallet

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

    Transaction:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        currency:
          type: string
        amount:
          type: string
        fee:
          type: string
        status:
          type: string
        sourceBot:
          type: ["string", "null"]
        referenceId:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - type
        - currency
        - amount
        - fee
        - status
        - createdAt

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - data
        - total
        - page
        - limit

    Bot:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        commissionRate:
          type: string
        isActive:
          type: boolean
        totalVolumeUsdt:
          type: string
        totalCommissionUsdt:
          type: string
        createdAt:
          type: string
          format: date-time
        apiKey:
          type: string
          description: API key for bot authentication (only returned for admin endpoints and on creation)
      required:
        - id
        - slug
        - name
        - commissionRate
        - isActive
        - totalVolumeUsdt
        - totalCommissionUsdt
        - createdAt

    CreateBotBody:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        commissionRate:
          type: string
      required:
        - slug
        - name

    BotUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        commissionRate:
          type: string
          description: Commission rate as decimal (e.g. "0.05" = 5%)
        isActive:
          type: boolean

    PlatformSettingsFinancial:
      type: object
      properties:
        minDepositUsdt:
          type: string
        minDepositTon:
          type: string
        minDepositStars:
          type: string
        minWithdrawalSkz:
          type: string
        withdrawalFeeUsdtPercent:
          type: string
        withdrawalFeeTonPercent:
          type: string
        referralBonusPercent:
          type: string
          description: Level 1 referral bonus percent
        referralL2Percent:
          type: string
          description: Level 2 referral bonus percent
        referralL3Percent:
          type: string
          description: Level 3 referral bonus percent
      required:
        - minDepositUsdt
        - minDepositTon
        - minDepositStars
        - minWithdrawalSkz
        - withdrawalFeeUsdtPercent
        - withdrawalFeeTonPercent
        - referralBonusPercent
        - referralL2Percent
        - referralL3Percent

    PlatformSettingsContent:
      type: object
      properties:
        platformName:
          type: string
        platformTagline:
          type: string
        welcomeMessage:
          type: string
        supportUsername:
          type: string
        referralMessage:
          type: string
      required:
        - platformName
        - platformTagline
        - welcomeMessage
        - supportUsername
        - referralMessage

    PlatformSettings:
      type: object
      properties:
        skzRates:
          $ref: "#/components/schemas/SkzRates"
        financial:
          $ref: "#/components/schemas/PlatformSettingsFinancial"
        content:
          $ref: "#/components/schemas/PlatformSettingsContent"
      required:
        - skzRates
        - financial
        - content

    PlatformSettingsInput:
      type: object
      properties:
        skzPerUsdt:
          type: string
        skzPerStar:
          type: string
        skzPerTon:
          type: string
