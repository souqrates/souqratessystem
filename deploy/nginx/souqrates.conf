# /etc/nginx/sites-available/souqrates.conf
# Single nginx server block that fronts every artifact for souqrates.com.
#
# Layout:
#   /api/*                      → 127.0.0.1:8080  (Express API server)
#   /telegram-webhook/<slug>    → 127.0.0.1:81xx  (per-bot aiohttp webhook)
#   /superadmin/*               → static (artifacts/superadmin/dist/public)
#   /books-bot-web/*            → static
#   /contests-bot-web/*         → static
#   /subagents-bot-web/*        → static
#   /games-bot/*                → static
#   /                            → static (bot-demo, the mother-bot Mini App root)
#
# All static roots are served out of /var/www/souqrates/<slug>/ — deploy.sh
# rsyncs each artifact's `dist/public` into the matching folder.

# Rate-limit zone for webhook traffic (shared 10MB ≈ 160k IPs)
limit_req_zone $binary_remote_addr zone=tg_webhook:10m rate=30r/s;

# Common Telegram-webhook proxy settings.
# (Inlined where used — keeps the file self-contained for the runbook.)

server {
    listen 80;
    listen [::]:80;
    server_name souqrates.com www.souqrates.com;

    # ACME http-01 challenge for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: force HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name souqrates.com www.souqrates.com;

    ssl_certificate     /etc/letsencrypt/live/souqrates.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/souqrates.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers (Mini App requires same-origin frames; Telegram embeds via iframe)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    # ─── Telegram webhooks ────────────────────────────────────────────────
    # Cloudflare must also be set to "Bypass cache" for /telegram-webhook/*.

    location = /telegram-webhook/mother-bot {
        limit_req zone=tg_webhook burst=60 nodelay;
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 75s;
    }
    location = /telegram-webhook/books-bot {
        limit_req zone=tg_webhook burst=60 nodelay;
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 75s;
    }
    location = /telegram-webhook/contests-bot {
        limit_req zone=tg_webhook burst=60 nodelay;
        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 75s;
    }
    location = /telegram-webhook/subagents-bot {
        limit_req zone=tg_webhook burst=60 nodelay;
        proxy_pass http://127.0.0.1:8104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 75s;
    }
    # Healthz probes — one explicit block per bot (nginx can't switch
    # upstream port inside a single regex location safely).
    location = /telegram-webhook/mother-bot/healthz    { proxy_pass http://127.0.0.1:8101; proxy_set_header Host $host; }
    location = /telegram-webhook/books-bot/healthz     { proxy_pass http://127.0.0.1:8102; proxy_set_header Host $host; }
    location = /telegram-webhook/contests-bot/healthz  { proxy_pass http://127.0.0.1:8103; proxy_set_header Host $host; }
    location = /telegram-webhook/subagents-bot/healthz { proxy_pass http://127.0.0.1:8104; proxy_set_header Host $host; }

    # ─── API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── Static Mini Apps / admin panel ───────────────────────────────────
    # Each artifact built with Vite, served as static + SPA fallback.

    # Per-app: each block also has a nested asset rule for long-cache headers.
    # Hashed asset files (Vite emits content-hashed names like main-abc123.js)
    # are immutable, so we cache them aggressively. index.html stays at 1h.
    #
    # IMPORTANT: a single global `location ~* \.js$` would override the prefix
    # locations and try to serve /superadmin/main-abc.js from the wrong root.
    # Keep asset rules nested inside each prefix block.

    # NOTE: these subpath SPAs use `root /var/www/souqrates` (NOT `alias`).
    # With `alias`, nginx's `try_files $uri` appends the FULL request URI
    # (including the /slug/ prefix) to the alias path, producing a doubled
    # path like /var/www/souqrates/games-bot/games-bot/assets/... → 404 for
    # every hashed asset. Because the on-disk layout is already
    # /var/www/souqrates/<slug>/..., `root /var/www/souqrates` + `$uri`
    # resolves correctly and `try_files` works as expected.

    location /superadmin/ {
        root /var/www/souqrates;
        try_files $uri $uri/ /superadmin/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|webp|svg|gif|map)$ {
            root /var/www/souqrates;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
    location /books-bot-web/ {
        root /var/www/souqrates;
        try_files $uri $uri/ /books-bot-web/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|webp|svg|gif|map)$ {
            root /var/www/souqrates;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
    location /contests-bot-web/ {
        root /var/www/souqrates;
        try_files $uri $uri/ /contests-bot-web/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|webp|svg|gif|map)$ {
            root /var/www/souqrates;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
    location /subagents-bot-web/ {
        root /var/www/souqrates;
        try_files $uri $uri/ /subagents-bot-web/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|webp|svg|gif|map)$ {
            root /var/www/souqrates;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
    location /games-bot/ {
        root /var/www/souqrates;
        try_files $uri $uri/ /games-bot/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|webp|svg|gif|map)$ {
            root /var/www/souqrates;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }

    # ─── Root: bot-demo (mother-bot Mini App, built with BASE_PATH=/) ─────
    location / {
        root /var/www/souqrates/bot-demo;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|webp|svg|gif|map)$ {
            root /var/www/souqrates/bot-demo;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}
