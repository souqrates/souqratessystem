<!DOCTYPE html>
<html lang="ar" dir="rtl" style="background:#030a05;color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#030a05" />
    <meta name="color-scheme" content="dark" />
    <style>html,body,#root{background:#030a05 !important;margin:0;padding:0;color-scheme:dark;}html{overflow:hidden;}@keyframes skz-bar{0%,100%{width:22%}50%{width:72%}}</style>
    <title>SOUQRATES SCRATCHY — ألعاب الحظ والحك واربح</title>
    <meta name="description" content="SOUQRATES SCRATCHY — العب، احك، واربح جوائز حقيقية بعملة SKZ ضمن منظومة SOUQRATES." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=block" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.documentElement.classList.add('ios');
      }
    </script>
    <script>
      (function(){
        try{
          var wa = window.Telegram && window.Telegram.WebApp;
          if(wa){
            try{ wa.setHeaderColor && wa.setHeaderColor('#030a05'); }catch(_){}
            try{ wa.setBackgroundColor && wa.setBackgroundColor('#030a05'); }catch(_){}
            try{ wa.setBottomBarColor && wa.setBottomBarColor('#030a05'); }catch(_){}
            try{ wa.ready && wa.ready(); }catch(_){}
            try{ wa.expand && wa.expand(); }catch(_){}
          }
        }catch(_){}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="skz-pre" aria-hidden="true" style="
        position:fixed;inset:0;z-index:9999;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(ellipse at 50% 35%,#0d1a06 0%,#060e03 55%,#020601 100%);
        pointer-events:none;user-select:none;gap:0;
      ">
        <img src="/souqrates-logo.webp" alt="" aria-hidden="true"
          style="display:block;width:min(68vw,240px);height:auto;margin-bottom:24px;
            filter:drop-shadow(0 8px 28px rgba(245,158,11,0.5)) drop-shadow(0 2px 10px rgba(34,197,94,0.35));" />
        <div style="
          font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(13px,4vw,19px);
          letter-spacing:0.12em;margin-bottom:5px;
          background:linear-gradient(180deg,#fef3c7 0%,#fbbf24 45%,#d97706 100%);
          -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        ">SOUQRATES SCRATCHY</div>
        <div style="font-size:11px;letter-spacing:0.1em;color:rgba(34,197,94,0.75);margin-bottom:28px;font-family:'Tajawal',sans-serif;">
          احك واربح
        </div>
        <div style="width:180px;height:3px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;">
          <div style="height:100%;border-radius:999px;
            background:linear-gradient(90deg,#d97706,#fbbf24 40%,#22c55e 75%,#4ade80 100%);
            box-shadow:0 0 10px rgba(251,191,36,0.5);
            animation:skz-bar 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
