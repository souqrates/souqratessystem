<!DOCTYPE html>
<html lang="ar" dir="rtl" style="background:#030a05;color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#030a05" />
    <meta name="color-scheme" content="dark" />
    <style>html,body,#root{background:#030a05 !important;margin:0;padding:0;color-scheme:dark;}html{overflow:hidden;}</style>
    <title>SOUQRATES SCRATCHY — ألعاب الحظ والحك واربح</title>
    <meta name="description" content="SOUQRATES SCRATCHY — العب، احك، واربح جوائز حقيقية بعملة SKZ ضمن منظومة SOUQRATES." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=block" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.documentElement.classList.add('ios');
      }
    </script>
    <script>
      (function(){
        try{
          var wa = window.Telegram && window.Telegram.WebApp;
          if(wa){
            try{ wa.setHeaderColor && wa.setHeaderColor('#030a05'); }catch(_){}
            try{ wa.setBackgroundColor && wa.setBackgroundColor('#030a05'); }catch(_){}
            try{ wa.setBottomBarColor && wa.setBottomBarColor('#030a05'); }catch(_){}
            try{ wa.ready && wa.ready(); }catch(_){}
            try{ wa.expand && wa.expand(); }catch(_){}
          }
        }catch(_){}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
