kind = "web"
previewPath = "/scratchy-bot-web/"
title = "SOUQRATES SCRATCHY — ألعاب الحظ والحك واربح"
version = "1.0.0"
id = "artifacts/bot-demo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/scratchy-bot-web/" ]
localPort = 21905

[services.development]
run = "pnpm --filter @workspace/scratchy-bot-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scratchy-bot-web", "run", "build" ]
publicDir = "artifacts/bot-demo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21905"
BASE_PATH = "/scratchy-bot-web/"
