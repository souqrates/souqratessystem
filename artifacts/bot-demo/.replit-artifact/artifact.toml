kind = "web"
previewPath = "/bot-demo/"
title = "محاكاة البوت - عرض المستخدم"
version = "1.0.0"
id = "artifacts/bot-demo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/bot-demo/" ]
localPort = 21905

[services.development]
run = "pnpm --filter @workspace/bot-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bot-demo", "run", "build" ]
publicDir = "artifacts/bot-demo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21905"
BASE_PATH = "/bot-demo/"
