kind = "web"
previewPath = "/games-bot/"
title = "بوت الألعاب - SOUQRATESSKILLZ"
version = "1.0.0"
id = "artifacts/games-bot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/games-bot/" ]
localPort = 21906

[services.development]
run = "pnpm --filter @workspace/games-bot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/games-bot", "run", "build" ]
publicDir = "artifacts/games-bot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21906"
BASE_PATH = "/games-bot/"
