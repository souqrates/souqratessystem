kind = "web"
previewPath = "/mother-bot-web/"
title = "SOUQRATES SYSTEM — البوّابة الموحّدة"
version = "1.0.0"
id = "artifacts/mother-bot-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mother-bot-web/" ]
localPort = 17321

[services.development]
run = "pnpm --filter @workspace/mother-bot-web run dev"

[services.production]
publicDir = "artifacts/mother-bot-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "17321"
BASE_PATH = "/mother-bot-web/"
