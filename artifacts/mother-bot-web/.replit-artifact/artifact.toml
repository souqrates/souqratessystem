kind = "web"
previewPath = "/mother-bot-web/"
title = "SOUQRATES SYSTEM — البوت الأم"
version = "1.0.0"
id = "artifacts/mother-bot-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mother-bot-web/" ]
localPort = 24913

[services.development]
run = "pnpm --filter @workspace/mother-bot-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mother-bot-web", "run", "build" ]
publicDir = "artifacts/mother-bot-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24913"
BASE_PATH = "/mother-bot-web/"
