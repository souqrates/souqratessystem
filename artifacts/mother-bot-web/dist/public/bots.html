<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0613" />
  <title>بوابة SOUQRATES</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow:hidden auto;background:#0a0613;color:#f8f4ff;font-family:'Tajawal',sans-serif;}
    body{padding:env(safe-area-inset-top,16px) 0 calc(env(safe-area-inset-bottom,0px)+16px);}

    /* ── Header ──────────────────────────────────────── */
    .header{text-align:center;padding:16px 16px 8px;}
    .header-logo{width:min(52vw,130px);height:auto;margin-bottom:10px;filter:drop-shadow(0 4px 16px rgba(168,85,247,0.5));}
    .header-title{font-family:'Orbitron',sans-serif;font-size:clamp(13px,4vw,18px);font-weight:900;letter-spacing:.1em;
      background:linear-gradient(180deg,#f5d0fe 0%,#d946ef 50%,#a21caf 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:3px;}
    .header-sub{font-size:12px;color:rgba(216,180,254,.6);letter-spacing:.08em;}

    /* ── Wallet card ─────────────────────────────────── */
    .wallet-wrap{padding:8px 12px 4px;}
    .wallet-card{border-radius:18px;padding:14px 18px;background:rgba(217,70,239,.07);
      border:1px solid rgba(217,70,239,.22);position:relative;overflow:hidden;}
    .wallet-card::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;
      border-radius:50%;background:rgba(217,70,239,.15);filter:blur(30px);pointer-events:none;}
    .wallet-label{font-size:11px;color:rgba(216,180,254,.55);letter-spacing:.08em;margin-bottom:6px;text-transform:uppercase;}
    .wallet-row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;}
    .wallet-item{}
    .wallet-amount{font-family:'Orbitron',sans-serif;font-size:clamp(17px,5vw,22px);font-weight:900;
      background:linear-gradient(135deg,#f5d0fe,#d946ef);-webkit-background-clip:text;
      -webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
    .wallet-curr{font-size:10px;color:rgba(216,180,254,.5);letter-spacing:.06em;margin-top:3px;}
    .wallet-sep{width:1px;height:32px;background:rgba(217,70,239,.18);align-self:center;}

    /* ── Skeleton ────────────────────────────────────── */
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    .skel{border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.06) 25%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.06) 75%);
      background-size:800px 100%;animation:shimmer 1.4s ease-in-out infinite;}

    /* ── Bot grid ────────────────────────────────────── */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 12px 24px;}
    .card{position:relative;border-radius:18px;padding:18px 14px;cursor:pointer;
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
      transition:transform .15s ease,box-shadow .15s ease;overflow:hidden;-webkit-tap-highlight-color:transparent;}
    .card::before{content:'';position:absolute;inset:0;border-radius:inherit;opacity:0;
      transition:opacity .15s;background:rgba(255,255,255,0.04);}
    .card:active{transform:scale(0.96);}
    .card:active::before{opacity:1;}
    .card-glow{position:absolute;width:80px;height:80px;border-radius:50%;top:-20px;left:-20px;
      opacity:0.18;filter:blur(24px);pointer-events:none;}
    .card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      margin-bottom:10px;font-size:22px;position:relative;z-index:1;}
    .card-brand{font-family:'Orbitron',sans-serif;font-size:clamp(9px,2.6vw,11px);font-weight:900;
      letter-spacing:.08em;margin-bottom:4px;position:relative;z-index:1;}
    .card-ar{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);margin-bottom:4px;position:relative;z-index:1;}
    .card-desc{font-size:11px;color:rgba(255,255,255,.45);line-height:1.4;position:relative;z-index:1;}
    .card-badge{position:absolute;top:10px;left:10px;font-size:9px;font-weight:700;letter-spacing:.06em;
      padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);}
    .badge-system{background:rgba(217,70,239,.2);color:#e879f9;}
    .footer{text-align:center;padding:4px 16px;font-size:10px;color:rgba(255,255,255,.2);letter-spacing:.06em;}

    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    .loading-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1s ease-in-out infinite;}
    .loading-dot:nth-child(2){animation-delay:.2s;}
    .loading-dot:nth-child(3){animation-delay:.4s;}
  </style>
</head>
<body>
  <div class="header">
    <img class="header-logo" src="./souqrates-logo.webp" alt="SOUQRATES" onerror="this.style.display='none'" />
    <div class="header-title">SOUQRATES NETWORK</div>
    <div class="header-sub">اختر التطبيق الذي تريد فتحه</div>
  </div>

  <!-- Unified wallet balance -->
  <div class="wallet-wrap">
    <div class="wallet-card">
      <div class="wallet-label">محفظتك الموحدة</div>
      <div class="wallet-row" id="walletRow">
        <!-- Skeleton shown while fetching -->
        <div class="wallet-item">
          <div class="skel" style="width:90px;height:22px;margin-bottom:6px;"></div>
          <div class="skel" style="width:40px;height:10px;"></div>
        </div>
        <div class="wallet-sep"></div>
        <div class="wallet-item">
          <div class="skel" style="width:70px;height:22px;margin-bottom:6px;"></div>
          <div class="skel" style="width:35px;height:10px;"></div>
        </div>
        <div class="wallet-sep"></div>
        <div class="wallet-item">
          <div class="skel" style="width:60px;height:22px;margin-bottom:6px;"></div>
          <div class="skel" style="width:30px;height:10px;"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid" id="botsGrid">
    <!-- Cards injected by JS -->
  </div>

  <div class="footer">SOUQRATES SYSTEM &nbsp;·&nbsp; Unified Platform</div>

  <script>
  (function(){
    var wa = window.Telegram && window.Telegram.WebApp;
    if(wa){
      try{wa.setHeaderColor('#0a0613');}catch(_){}
      try{wa.setBackgroundColor('#0a0613');}catch(_){}
      try{wa.setBottomBarColor('#0a0613');}catch(_){}
      try{wa.ready();}catch(_){}
      try{wa.expand();}catch(_){}
    }

    // ── Wallet balance ────────────────────────────────────────────────────────
    function fmt(n, decimals) {
      var num = parseFloat(n) || 0;
      if(num === 0) return '0';
      if(decimals === 0) return Math.floor(num).toLocaleString('en');
      return num.toLocaleString('en', {minimumFractionDigits: 0, maximumFractionDigits: decimals});
    }

    function renderWallet(w) {
      var row = document.getElementById('walletRow');
      if(!row) return;
      row.innerHTML =
        '<div class="wallet-item">' +
          '<div class="wallet-amount">' + fmt(w.balanceSkz, 2) + '</div>' +
          '<div class="wallet-curr">SKZ</div>' +
        '</div>' +
        '<div class="wallet-sep"></div>' +
        '<div class="wallet-item">' +
          '<div class="wallet-amount" style="font-size:clamp(14px,4vw,18px);">' + fmt(w.balanceStars, 0) + '</div>' +
          '<div class="wallet-curr">Stars</div>' +
        '</div>' +
        '<div class="wallet-sep"></div>' +
        '<div class="wallet-item">' +
          '<div class="wallet-amount" style="font-size:clamp(13px,3.5vw,16px);">' + fmt(w.balanceTon, 4) + '</div>' +
          '<div class="wallet-curr">TON</div>' +
        '</div>';
    }

    function fetchWallet() {
      var userId = '';
      try {
        userId = String(wa && wa.initDataUnsafe && wa.initDataUnsafe.user && wa.initDataUnsafe.user.id || '');
      } catch(_) {}
      if(!userId) {
        // No Telegram user context (opened in browser preview) — hide wallet card
        var wrap = document.querySelector('.wallet-wrap');
        if(wrap) wrap.style.display = 'none';
        return;
      }
      fetch('/api/users/' + userId)
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(data){
          if(data && data.wallet) {
            renderWallet(data.wallet);
          } else {
            var wrap = document.querySelector('.wallet-wrap');
            if(wrap) wrap.style.display = 'none';
          }
        })
        .catch(function(){
          var wrap = document.querySelector('.wallet-wrap');
          if(wrap) wrap.style.display = 'none';
        });
    }

    // Fetch wallet balance immediately
    fetchWallet();

    // ── Bot definitions ───────────────────────────────────────────────────────
    var BOTS = [
      {
        slug:'mother-bot',
        brand:'SOUQRATES SYSTEM',
        arName:'البوابة الموحدة',
        desc:'محفظتك وحسابك المركزي',
        color:'#d946ef',
        gradient:'linear-gradient(135deg,#7e22ce,#a855f7)',
        icon:'⬡',
        badge:'system',
        badgeLabel:'أنت هنا',
        botUsername:'',
        miniAppName:'',
      },
      {
        slug:'scratchy-bot',
        brand:'SOUQRATES SCRATCHY',
        arName:'احك واربح',
        desc:'ألعاب الحظ والجوائز الفورية',
        color:'#fbbf24',
        gradient:'linear-gradient(135deg,#78350f,#d97706)',
        icon:'◈',
        botUsername:'',
        miniAppName:'',
      },
      {
        slug:'games-bot',
        brand:'SOUQRATES SKILLZ',
        arName:'الألعاب',
        desc:'ألعاب المهارة والمنافسة',
        color:'#22d3ee',
        gradient:'linear-gradient(135deg,#0e7490,#06b6d4)',
        icon:'◉',
        botUsername:'',
        miniAppName:'',
      },
      {
        slug:'books-bot',
        brand:'SOUQRATES SOUQ',
        arName:'الكتب والمنتجات',
        desc:'اشترِ وانشر واربح رقمياً',
        color:'#34d399',
        gradient:'linear-gradient(135deg,#065f46,#059669)',
        icon:'◧',
        botUsername:'',
        miniAppName:'',
      },
      {
        slug:'contests-bot',
        brand:'SOUQRATES STAGE',
        arName:'المسابقات',
        desc:'صوّت وشارك وفُز بجوائز',
        color:'#facc15',
        gradient:'linear-gradient(135deg,#713f12,#ca8a04)',
        icon:'◬',
        botUsername:'',
        miniAppName:'',
      },
      {
        slug:'subagents-bot',
        brand:'SOUQRATES SUB-AGENTS',
        arName:'الشركاء',
        desc:'برنامج الشراكة والعمولات',
        color:'#60a5fa',
        gradient:'linear-gradient(135deg,#1e3a8a,#2563eb)',
        icon:'◫',
        botUsername:'',
        miniAppName:'',
      },
    ];

    function openBot(bot) {
      if(!wa) { return; }
      var username = bot.botUsername;
      var appName  = bot.miniAppName;
      if(username) {
        var url = appName
          ? 'https://t.me/' + username + '/' + appName
          : 'https://t.me/' + username;
        try{ wa.openTelegramLink(url); } catch(_){
          try{ wa.openLink(url); } catch(__){};
        }
      }
    }

    function hexA(hex, a) {
      var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
      return 'rgba('+r+','+g+','+b+','+a+')';
    }

    function renderCards(bots) {
      var grid = document.getElementById('botsGrid');
      grid.innerHTML = '';
      bots.forEach(function(bot){
        var card = document.createElement('div');
        card.className = 'card';
        var hasDest = !!bot.botUsername;
        var badgeHtml = bot.badge === 'system'
          ? '<div class="card-badge badge-system">' + bot.badgeLabel + '</div>'
          : (hasDest ? '' : '<div class="card-badge">قريباً</div>');
        card.innerHTML =
          '<div class="card-glow" style="background:' + bot.color + ';"></div>' +
          '<div class="card-icon" style="background:' + bot.gradient + ';box-shadow:0 4px 14px ' + hexA(bot.color,.35) + ';">' +
            '<span style="color:#fff;font-family:monospace;">' + bot.icon + '</span>' +
          '</div>' +
          '<div class="card-brand" style="color:' + bot.color + ';">' + bot.brand + '</div>' +
          '<div class="card-ar">' + bot.arName + '</div>' +
          '<div class="card-desc">' + bot.desc + '</div>' +
          badgeHtml;
        card.style.boxShadow = hasDest || bot.badge === 'system'
          ? '0 2px 20px ' + hexA(bot.color,.12) + ', inset 0 0 0 1px ' + hexA(bot.color,.18)
          : 'none';
        if(bot.badge !== 'system') {
          card.addEventListener('click', function(){ openBot(bot); });
        }
        grid.appendChild(card);
      });
    }

    // Initial render with defaults
    renderCards(BOTS);

    // Fetch live bot usernames from API and re-render
    fetch('/api/public/bots-hub')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(!data.data) return;
        var map = {};
        data.data.forEach(function(b){ map[b.slug] = b; });
        BOTS.forEach(function(bot){
          if(map[bot.slug]){
            bot.botUsername = map[bot.slug].botUsername || '';
            bot.miniAppName = map[bot.slug].miniAppName || '';
          }
        });
        renderCards(BOTS);
      })
      .catch(function(){});
  })();
  </script>
</body>
</html>
