<!DOCTYPE html>
<html lang="ar" dir="rtl" style="background:#070511;color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SOUQRATES SYSTEM — البوّابة الموحّدة</title>
    <meta name="description" content="SOUQRATES SYSTEM — البوّابة الموحّدة لكل بوتات سوقراط: المحفظة، الألعاب، الكتب، الحظ، المسابقات والشركاء في مكان واحد." />
    <meta name="theme-color" content="#070511" />
    <meta name="color-scheme" content="dark" />
    <style>
      html,body,#root{background:#070511 !important;margin:0;padding:0;color-scheme:dark;}
      *{box-sizing:border-box;}
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function(){
        try{
          var wa = window.Telegram && window.Telegram.WebApp;
          if(wa){
            try{ wa.setHeaderColor && wa.setHeaderColor('#070511'); }catch(_){}
            try{ wa.setBackgroundColor && wa.setBackgroundColor('#070511'); }catch(_){}
            try{ wa.setBottomBarColor && wa.setBottomBarColor('#070511'); }catch(_){}
            try{ wa.ready && wa.ready(); }catch(_){}
            try{ wa.expand && wa.expand(); }catch(_){}
          }
        }catch(_){}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
