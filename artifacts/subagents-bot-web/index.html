<!DOCTYPE html>
<html lang="ar" dir="rtl" style="background:#07060d;color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#07060d" />
    <meta name="color-scheme" content="dark" />
    <style>html,body,#root{background:#07060d !important;margin:0;padding:0;color-scheme:dark;}html{overflow:hidden;}@keyframes skz-bar{0%,100%{width:22%}50%{width:72%}}</style>
    <title>SOUQRATES SUB-AGENTS — برنامج الشركاء</title>
    <meta name="description" content="SOUQRATES SUB-AGENTS — برنامج الشركاء" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800&display=block" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.documentElement.classList.add('ios');
      }
    </script>
    <script>
      (function(){
        try{
          var wa = window.Telegram && window.Telegram.WebApp;
          if(wa){
            try{ wa.setHeaderColor && wa.setHeaderColor('#07060d'); }catch(_){}
            try{ wa.setBackgroundColor && wa.setBackgroundColor('#07060d'); }catch(_){}
            try{ wa.setBottomBarColor && wa.setBottomBarColor('#07060d'); }catch(_){}
            try{ wa.ready && wa.ready(); }catch(_){}
            try{ wa.expand && wa.expand(); }catch(_){}
          }
        }catch(_){}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="skz-pre" aria-hidden="true" style="
        position:fixed;inset:0;z-index:9999;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(ellipse at 50% 35%,#06101a 0%,#030810 55%,#010306 100%);
        pointer-events:none;user-select:none;gap:0;
      ">
        <img src="/souqrates-logo.webp" alt="" aria-hidden="true"
          style="display:block;width:min(68vw,240px);height:auto;margin-bottom:24px;
            filter:drop-shadow(0 8px 28px rgba(59,130,246,0.45)) drop-shadow(0 2px 10px rgba(249,115,22,0.3));" />
        <div style="
          font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(12px,3.8vw,17px);
          letter-spacing:0.1em;margin-bottom:5px;
          background:linear-gradient(180deg,#dbeafe 0%,#60a5fa 45%,#2563eb 100%);
          -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        ">SOUQRATES SUB-AGENTS</div>
        <div style="font-size:11px;letter-spacing:0.1em;color:rgba(249,115,22,0.75);margin-bottom:28px;font-family:'Cairo',sans-serif;">
          برنامج الشركاء
        </div>
        <div style="width:180px;height:3px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;">
          <div style="height:100%;border-radius:999px;
            background:linear-gradient(90deg,#2563eb,#60a5fa 40%,#f97316 80%,#fb923c 100%);
            box-shadow:0 0 10px rgba(96,165,250,0.5);
            animation:skz-bar 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
